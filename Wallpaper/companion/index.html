<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script>
    const requestedLayer = new URLSearchParams(location.search).get('layer');
    document.documentElement.dataset.layer = ['background', 'character'].includes(requestedLayer)
      ? requestedLayer
      : 'all';
  </script>
  <style>
    :root {
      color-scheme: dark;
      --scene-fallback: rgb(13 49 73);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--scene-fallback);
      pointer-events: none;
      user-select: none;
    }

    html[data-layer="character"],
    html[data-layer="character"] body {
      background: transparent;
    }

    html[data-layer="character"] #sceneRoot,
    html[data-layer="character"] #ambientCanvas,
    html[data-layer="background"] #webglCanvas,
    html[data-layer="background"] #fallbackPortrait,
    html[data-layer="background"] #speechBubble,
    html[data-layer="background"] #bedOverlay {
      display: none;
    }

    /* The blanket over her while she sleeps: cut from the room picture, laid over the character. */
    #bedOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      opacity: 0;
    }

    html[data-layer="character"] #sceneRoot {
      background: none;
    }

    #sceneRoot,
    .scene,
    .scene-layer,
    .scene-mark,
    #ambientCanvas,
    #webglCanvas,
    #fallbackPortrait,
    #speechBubble {
      position: absolute;
    }

    #sceneRoot,
    .scene,
    .scene-layer,
    .scene-mark,
    #ambientCanvas,
    #webglCanvas {
      inset: 0;
    }

    #ambientCanvas {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #sceneRoot {
      background:
        url('../assets/scenes/shibuya-hachiko.png') center / cover no-repeat,
        var(--scene-fallback);
    }

    .scene {
      opacity: 0;
    }

    .scene-layer,
    .scene-mark {
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .scene-dusk,
    .scene-night {
      transition: opacity 1s linear;
    }

    .scene[data-scene="shibuya"] .scene-dusk {
      filter: brightness(0.9) sepia(0.15) saturate(1.05);
    }

    .scene[data-scene="shibuya"] .scene-night {
      background-color: rgb(211 228 255);
      background-blend-mode: multiply;
      filter: brightness(0.55) saturate(0.8);
    }

    #webglCanvas {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .interaction-enabled #webglCanvas {
      pointer-events: auto;
      touch-action: none;
    }

    #fallbackPortrait {
      right: 2vw;
      bottom: -1vh;
      height: 72vh;
      max-width: 46vw;
      object-fit: contain;
      object-position: right bottom;
      filter: drop-shadow(0 10px 22px rgb(0 22 42 / 0.24));
      transform-origin: 60% 100%;
      animation: fallback-breathe 8.5s ease-in-out infinite alternate;
      transition: opacity 500ms ease;
    }

    .webgl-ready #webglCanvas {
      opacity: 1;
    }

    .webgl-ready #fallbackPortrait {
      opacity: 0;
    }

    #speechBubble {
      --bubble-accent: rgb(57 197 187);
      left: 50%;
      top: 16%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      min-width: 6.5rem;
      max-width: min(26rem, 34vw);
      padding: 0.7rem 1rem 0.78rem;
      border: 2px solid var(--bubble-accent);
      border-radius: 1.15rem;
      color: rgb(22 52 58);
      background:
        radial-gradient(circle at 100% 0%, rgb(57 197 187 / 0.14), transparent 55%),
        rgb(252 255 255 / 0.94);
      box-shadow:
        0 10px 28px rgb(0 40 52 / 0.18),
        0 0 0 4px rgb(255 255 255 / 0.35);
      font: 500 clamp(13px, 1vw, 16px) / 1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "PingFang TC", sans-serif;
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translate(-50%, calc(-100% + 10px)) scale(0.96);
      transform-origin: 50% 100%;
      transition: opacity 240ms ease, transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1), border-color 300ms ease;
    }

    /* Tail pointing down towards Miku. */
    #speechBubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 14px;
      height: 14px;
      background: rgb(252 255 255 / 0.94);
      border-right: 2px solid var(--bubble-accent);
      border-bottom: 2px solid var(--bubble-accent);
      border-bottom-right-radius: 3px;
      transform: translateX(-50%) rotate(45deg);
    }

    #speechBubble .bubble-name {
      align-self: flex-start;
      padding: 0.05rem 0.55rem;
      border-radius: 999px;
      color: white;
      background: var(--bubble-accent);
      font-size: 0.68em;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    #speechBubble .bubble-name::after {
      content: " ♪";
      letter-spacing: 0;
    }

    #speechBubble .bubble-text {
      overflow-wrap: anywhere;
    }

    #speechBubble.visible {
      opacity: 1;
      transform: translate(-50%, -100%) scale(1);
    }

    #speechBubble[data-emotion="happy"] {
      --bubble-accent: rgb(229 48 126);
    }

    #speechBubble[data-emotion="curious"] {
      --bubble-accent: rgb(84 150 222);
    }

    #speechBubble[data-emotion="sleepy"] {
      --bubble-accent: rgb(150 128 205);
    }

    #speechBubble[data-emotion="dizzy"] {
      --bubble-accent: rgb(232 150 30);
    }

    #speechBubble[data-emotion="dizzy"] .bubble-text {
      display: inline-block;
      animation: bubble-wobble 0.8s ease-in-out infinite;
    }

    #speechBubble[data-emotion="pout"] {
      --bubble-accent: rgb(226 70 80);
    }

    @keyframes bubble-wobble {
      0%, 100% { transform: rotate(-3deg) translateX(-1px); }
      50% { transform: rotate(3deg) translateX(1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #speechBubble[data-emotion="dizzy"] .bubble-text { animation: none; }
    }

    #speechBubble.thinking .bubble-text {
      color: rgb(57 197 187);
      font-weight: 800;
      letter-spacing: 0.2em;
      animation: thinking-notes 1.1s ease-in-out infinite;
    }

    @keyframes thinking-notes {
      0%, 100% { opacity: 0.35; transform: translateY(1px); }
      50% { opacity: 1; transform: translateY(-2px); }
    }

    /* Hover feedback */
    .interaction-enabled.miku-hover #webglCanvas {
      cursor: pointer;
    }

    .interaction-enabled.miku-hover[data-hover-zone="head"] #webglCanvas {
      cursor: grab;
    }

    .hover-note {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      color: rgb(57 197 187);
      font: 800 22px / 1 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
      text-shadow:
        0 0 6px rgb(255 255 255 / 0.95),
        0 0 14px rgb(57 197 187 / 0.55);
      transform: translate(-50%, -50%);
      animation: hover-note-float 1.25s cubic-bezier(0.22, 0.8, 0.36, 1) forwards;
    }

    .hover-note.zone-head {
      color: rgb(229 48 126);
      text-shadow:
        0 0 6px rgb(255 255 255 / 0.95),
        0 0 14px rgb(229 48 126 / 0.5);
    }

    .hover-note.zone-dizzy {
      color: rgb(245 186 40);
      font-size: 19px;
      text-shadow:
        0 0 6px rgb(255 255 255 / 0.95),
        0 0 12px rgb(245 186 40 / 0.6);
      animation: dizzy-star 1.15s cubic-bezier(0.3, 0.7, 0.4, 1) forwards;
    }

    @keyframes dizzy-star {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      20% {
        opacity: 1;
        transform: translate(calc(-50% + var(--drift) * 0.5), -80%) scale(1.1) rotate(120deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% - var(--drift)), -150%) scale(0.7) rotate(420deg);
      }
    }

    @keyframes hover-note-float {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.5) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -90%) scale(1.08) rotate(calc(var(--spin) * 0.3));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--drift)), -260%) scale(0.85) rotate(var(--spin));
      }
    }

    @keyframes fallback-breathe {
      from { transform: translate3d(0, 2px, 0); }
      to { transform: translate3d(0, -2px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene,
      .scene-dusk,
      .scene-night,
      #webglCanvas,
      #fallbackPortrait,
      #speechBubble {
        transition: none;
      }

      #fallbackPortrait,
      #speechBubble.thinking .bubble-text {
        animation: none;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="sceneRoot" aria-hidden="true"></div>
  <canvas id="ambientCanvas" aria-hidden="true"></canvas>
  <canvas id="webglCanvas" aria-hidden="true"></canvas>
  <img id="bedOverlay" alt="" draggable="false">
  <img id="fallbackPortrait" data-src="../assets/miku.png" alt="" draggable="false">
  <div id="speechBubble" role="status" aria-live="polite"></div>
  <script type="module" src="./companion.js"></script>
</body>
</html>
