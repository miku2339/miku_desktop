<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script>
    const requestedLayer = new URLSearchParams(location.search).get('layer');
    document.documentElement.dataset.layer = ['background', 'character'].includes(requestedLayer)
      ? requestedLayer
      : 'all';
  </script>
  <style>
    :root {
      color-scheme: dark;
      --scene-fallback: rgb(13 49 73);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--scene-fallback);
      pointer-events: none;
      user-select: none;
    }

    html[data-layer="character"],
    html[data-layer="character"] body {
      background: transparent;
    }

    html[data-layer="character"] #sceneRoot,
    html[data-layer="background"] #webglCanvas,
    html[data-layer="background"] #fallbackPortrait,
    html[data-layer="background"] #speechBubble {
      display: none;
    }

    html[data-layer="character"] #sceneRoot {
      background: none;
    }

    #sceneRoot,
    .scene,
    .scene-layer,
    .scene-mark,
    #webglCanvas,
    #fallbackPortrait,
    #speechBubble {
      position: absolute;
    }

    #sceneRoot,
    .scene,
    .scene-layer,
    .scene-mark,
    #webglCanvas {
      inset: 0;
    }

    #sceneRoot {
      background:
        url('../assets/sekai-day.jpg') center / cover no-repeat,
        var(--scene-fallback);
    }

    .scene {
      opacity: 0;
    }

    .scene-layer,
    .scene-mark {
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .scene-dusk,
    .scene-night {
      transition: opacity 1s linear;
    }

    #webglCanvas {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .interaction-enabled #webglCanvas {
      pointer-events: auto;
      touch-action: none;
    }

    #fallbackPortrait {
      right: 2vw;
      bottom: -1vh;
      height: 72vh;
      max-width: 46vw;
      object-fit: contain;
      object-position: right bottom;
      filter: drop-shadow(0 10px 22px rgb(0 22 42 / 0.24));
      transform-origin: 60% 100%;
      animation: fallback-breathe 8.5s ease-in-out infinite alternate;
      transition: opacity 500ms ease;
    }

    .webgl-ready #webglCanvas {
      opacity: 1;
    }

    .webgl-ready #fallbackPortrait {
      opacity: 0;
    }

    #speechBubble {
      left: 50%;
      top: 16%;
      z-index: 4;
      max-width: min(28rem, 34vw);
      padding: 0.66rem 0.9rem;
      border: 1px solid rgb(255 255 255 / 0.52);
      border-radius: 1rem 1rem 1rem 0.35rem;
      color: rgb(22 48 59);
      background: rgb(249 255 255 / 0.88);
      box-shadow: 0 7px 24px rgb(0 28 45 / 0.16);
      font: 500 clamp(13px, 1vw, 16px) / 1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translate(-50%, 8px) scale(0.98);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    #speechBubble.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #speechBubble[data-emotion="happy"] {
      border-color: rgb(77 205 194 / 0.48);
    }

    #speechBubble[data-emotion="curious"] {
      border-color: rgb(118 167 219 / 0.52);
    }

    #speechBubble[data-emotion="sleepy"] {
      border-color: rgb(171 151 211 / 0.48);
    }

    @keyframes fallback-breathe {
      from { transform: translate3d(0, 2px, 0); }
      to { transform: translate3d(0, -2px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene,
      .scene-dusk,
      .scene-night,
      #webglCanvas,
      #fallbackPortrait,
      #speechBubble {
        transition: none;
      }

      #fallbackPortrait {
        animation: none;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="sceneRoot" aria-hidden="true"></div>
  <canvas id="webglCanvas" aria-hidden="true"></canvas>
  <img id="fallbackPortrait" data-src="../assets/miku.png" alt="" draggable="false">
  <div id="speechBubble" role="status" aria-live="polite"></div>
  <script type="module" src="./companion.js"></script>
</body>
</html>
