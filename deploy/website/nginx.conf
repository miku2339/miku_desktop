worker_processes 1;
pid /home/233/apps/miku-desktop-site/run/nginx.pid;
error_log /home/233/apps/miku-desktop-site/run/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    server {
        listen 127.0.0.1:8810;
        server_name miku.qimake.com;
        root /home/233/apps/miku-desktop-site/current;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location ~ (^|/)\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
